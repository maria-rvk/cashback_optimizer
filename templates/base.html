<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Кэшбэк-оптимизатор{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Главная</a>
	<a href="{{ url_for('recommend') }}">Советник</a>
        <a href="{{ url_for('transactions_list') }}">Траты</a>
        <a href="{{ url_for('cards_list') }}">Карты</a>
        <a href="{{ url_for('stats') }}">Статистика</a>
    </nav>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="flash">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
